<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="icon" type="image/svg+xml" href="logo.svg?v=7a8b03a"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garra Games 2026 | Ranking oficial</title><style>:root{--bg:#08051d;--panel:#15103d;--ink:#fff;--muted:#b9b2d4;--pink:#ff3cda;--aqua:#49eeff;--lime:#c7ff5b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#2920a2,transparent 36%),radial-gradient(circle at 0 100%,#8b187b,transparent 35%),var(--bg);color:var(--ink);font-family:Arial,sans-serif;min-height:100vh}.wrap{max-width:1250px;margin:auto;padding:30px 20px}.head{display:flex;justify-content:space-between;align-items:start}.logo{margin-bottom:16px}.logo img{display:block;width:180px;height:auto}.status{display:none}.tools{display:flex;justify-content:space-between;align-items:end;margin:28px 0 14px;gap:16px}.eyebrow{color:var(--lime);font-size:12px;font-weight:bold;letter-spacing:2px;margin:0 0 12px}h2{margin:0}select{background:var(--panel);border:1px solid #51478c;border-radius:8px;color:#fff;padding:11px;min-width:255px;font-weight:bold}.board{overflow:auto;border:1px solid #49407a;border-radius:14px;background:rgba(21,16,61,.9)}table{width:100%;border-collapse:collapse;white-space:nowrap}th{background:#251c61;color:var(--muted);font-size:11px;letter-spacing:1px;padding:15px 10px;cursor:pointer;text-transform:uppercase}td{border-top:1px solid #332b63;padding:15px 10px;text-align:center}th:nth-child(2),td:nth-child(2){text-align:left}.pos{color:var(--aqua);font-weight:bold}.team{color:var(--aqua);cursor:pointer;text-decoration:underline;font-weight:bold}.pts{color:var(--lime);font-weight:bold}.score small{display:block;color:var(--muted);font-size:10px;margin-top:3px}dialog{background:#191043;color:white;border:1px solid var(--pink);border-radius:16px;min-width:280px;padding:25px}dialog::backdrop{background:#000b}dialog button{background:var(--pink);border:0;padding:9px 14px;border-radius:8px;font-weight:bold;cursor:pointer}@media(max-width:600px){.status{display:none}.wrap{padding:24px 12px}.tools{align-items:stretch;flex-direction:column}select{width:100%}.logo img{width:140px}}</style></head><body><main class="wrap"><header class="head"><div class="logo"><img src="logo.svg?v=7a8b03a" alt="Garra Games 2026 — Campeonato Interno"></div><span class="status" id="status">CARREGANDO</span></header><section class="tools"><div><p class="eyebrow">CLASSIFICAÇÃO</p><h2>Ranking geral</h2></div><select id="cat" aria-label="Categoria"></select></section><div class="board"><table id="board"></table></div></main><dialog id="modal"><h3 id="modalTitle"></h3><p id="modalBody"></p><button onclick="modal.close()">Fechar</button></dialog><script>const URL='https://script.google.com/macros/s/AKfycbzUdtnxTQuUBUk67RTPkGdxF_lCASb14O58oDQSpmXJqmIAHX3IR8HJy1hMtYoLQB7JvA/exec';let data,wods,sort={key:'posicao',asc:true};const cat=document.querySelector('#cat'),board=document.querySelector('#board'),modal=document.querySelector('#modal');function showTeam(i){let r=data[i];modalTitle.textContent=r.equipe;modalBody.innerHTML=r.atletas.length?r.atletas.join('<br>'):'Integrantes ainda não informados';modal.showModal()}function metric(r,k){return k.startsWith('WOD-')?(r.resultados[k]?.pontos??999):(r[k]??'')}function render(){let rows=data.filter(r=>r.categoria===cat.value).sort((a,b)=>{let x=metric(a,sort.key),y=metric(b,sort.key);return sort.asc?String(x).localeCompare(String(y),undefined,{numeric:true}):String(y).localeCompare(String(x),undefined,{numeric:true})});let cols=[['posicao','Pos.'],['equipe','Equipe'],...wods.map(w=>[w.id,w.nome]),['pontos','Total']];board.innerHTML='<thead><tr>'+cols.map(c=>'<th onclick="order(\''+c[0]+'\')">'+c[1]+' ↕</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr><td class="pos">'+r.posicao+'º</td><td><span class="team" onclick="showTeam('+data.indexOf(r)+')">'+r.equipe+'</span></td>'+wods.map(w=>{let s=r.resultados[w.id];return '<td class="score">'+(s?'<b>'+s.pontos+'</b><small>'+s.resultado+(s.unidade==='mm:ss'?'':' '+s.unidade)+'</small>':'—')+'</td>'}).join('')+'<td class="pts">'+r.pontos+'</td></tr>').join('')+'</tbody>'}function order(k){sort={key:k,asc:sort.key===k?!sort.asc:true};render()}fetch(URL).then(r=>r.json()).then(p=>{data=p.ranking;wods=p.wods;cat.innerHTML=[...new Set(data.map(r=>r.categoria))].map(x=>'<option>'+x+'</option>').join('');cat.onchange=render;status.textContent='ATUALIZADO';render()}).catch(()=>status.textContent='INDISPONÍVEL');</script></body></html>
