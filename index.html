<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="icon" type="image/png" href="garra-games-2026-logo.png?v=dea85b4"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garra Games 2026 | Ranking oficial</title><style>:root{--bg:#08051d;--panel:#15103d;--ink:#fff;--muted:#b9b2d4;--pink:#ff3cda;--aqua:#49eeff;--lime:#c7ff5b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#2920a2,transparent 36%),radial-gradient(circle at 0 100%,#8b187b,transparent 35%),var(--bg);color:var(--ink);font-family:Arial,sans-serif;min-height:100vh}.wrap{max-width:1250px;margin:auto;padding:30px 20px}.head{display:flex;justify-content:space-between;align-items:start}.logo{margin-bottom:16px}.logo img{display:block;width:180px;height:auto}.head-actions{display:flex;align-items:center;gap:10px}.status{color:var(--muted);font-size:11px;letter-spacing:.7px}.refresh{background:transparent;border:1px solid var(--lime);border-radius:8px;color:var(--lime);cursor:pointer;font-size:12px;font-weight:bold;padding:8px 12px}.refresh:hover{background:var(--lime);color:var(--bg)}.tools{display:flex;justify-content:space-between;align-items:end;margin:28px 0 14px;gap:16px}.eyebrow{color:var(--lime);font-size:12px;font-weight:bold;letter-spacing:2px;margin:0 0 12px}h2{margin:0}select{background:var(--panel);border:1px solid #51478c;border-radius:8px;color:#fff;padding:11px;min-width:255px;font-weight:bold}.board{overflow:auto;border:1px solid #49407a;border-radius:14px;background:rgba(21,16,61,.9)}table{width:100%;min-width:42rem;table-layout:fixed;border-collapse:collapse}th,td{padding:15px 10px;text-align:center;vertical-align:middle;overflow-wrap:anywhere}th{background:#251c61;color:var(--muted);font-size:11px;letter-spacing:1px;text-transform:uppercase}th[onclick]{cursor:pointer}td{border-top:1px solid #332b63}.pos{color:var(--aqua);font-weight:bold}.team{color:var(--aqua);cursor:pointer;text-decoration:underline;font-weight:bold}.pts{color:var(--lime);font-weight:bold}.score small{display:block;color:var(--muted);font-size:10px;margin-top:3px}dialog{background:#191043;color:white;border:1px solid var(--pink);border-radius:16px;min-width:280px;padding:25px}dialog::backdrop{background:#000b}dialog button{background:var(--pink);border:0;padding:9px 14px;border-radius:8px;font-weight:bold;cursor:pointer}@media(max-width:600px){.head-actions{gap:6px}.status{font-size:10px}.refresh{padding:7px 9px}.wrap{padding:24px 12px}.tools{align-items:stretch;flex-direction:column}select{width:100%}.logo img{width:140px}}
</style></head><body><main class="wrap"><header class="head"><div class="logo"><img src="garra-games-2026-logo.png?v=dea85b4" alt="Garra Games 2026 — Campeonato Interno"></div><div class="head-actions"><span class="status" id="status">CARREGANDO</span><button class="refresh" type="button" onclick="loadData()">Atualizar</button></div></header><section class="tools"><div><p class="eyebrow">CLASSIFICAÇÃO</p><h2>Ranking geral</h2></div><select id="cat" aria-label="Categoria"></select></section><div class="board"><table id="board"></table></div></main><dialog id="modal"><h3 id="modalTitle"></h3><p id="modalBody"></p><button onclick="modal.close()">Fechar</button></dialog><script>
  // Limites da aba "WODs por categoria". A Prova 1 tem o mesmo limite em todas as categorias.
  const TIME_CAP_SECONDS = { 'WOD-001': 12 * 60 };

  function formatScore(score, wodId) {
    // O lançamento da Prova 2A é em lb, mesmo quando a API retorna o rótulo antigo (kg).
    const unit = wodId === 'WOD-002A' ? 'lb' : score.unidade;
    if (unit !== 'mm:ss') return score.resultado + ' ' + unit;

    const cap = TIME_CAP_SECONDS[wodId];
    const time = /^(?:(\d+):)?(\d+):([0-5]\d)$/.exec(String(score.resultado).trim());
    if (cap === undefined || !time) return score.resultado;

    const [, hours, minutes, seconds] = time;
    if (hours !== undefined && Number(minutes) >= 60) return score.resultado;

    const elapsed = Number(hours ?? 0) * 3600 + Number(minutes) * 60 + Number(seconds);
    return elapsed > cap ? 'CAP+' + (elapsed - cap) : score.resultado;
  }
const URL='https://script.google.com/macros/s/AKfycbzUdtnxTQuUBUk67RTPkGdxF_lCASb14O58oDQSpmXJqmIAHX3IR8HJy1hMtYoLQB7JvA/exec';let data,wods,sort={key:'posicao',asc:true};const cat=document.querySelector('#cat'),board=document.querySelector('#board'),modal=document.querySelector('#modal'),statusEl=document.querySelector('#status');function showTeam(i){let r=data[i];modalTitle.textContent=r.equipe;modalBody.innerHTML=r.atletas.length?r.atletas.join('<br>'):'Integrantes ainda não informados';modal.showModal()}function metric(r,k){if(k.startsWith('WOD-'))return r.resultados[k]?.pontos??999;if(k==='posicao'||k==='pontos')return r.posicao?(r[k]??999):999;return r[k]??''}
const SHARED_FIRST_CATEGORY = 'Kids e Master';

function render() {
  const sharedFirst = cat.value === SHARED_FIRST_CATEGORY;
  const rows = data.filter(row => row.categoria === cat.value);
  rows.sort((a, b) => {
    if (sharedFirst) return a.equipe.localeCompare(b.equipe, 'pt-BR');
    const x = metric(a, sort.key);
    const y = metric(b, sort.key);
    const comparison = String(x).localeCompare(String(y), undefined, { numeric: true });
    return sort.asc ? comparison : -comparison;
  });

  const columns = [['posicao', 'Pos.'], ['equipe', 'Equipe'], ...wods.map(wod => [wod.id, wod.nome])];
  if (!sharedFirst) columns.push(['pontos', 'Total']);
  const splitLabels = { 'WOD-002A': 'Prova 2A', 'WOD-002B': 'Prova 2B' };
  const headers = columns.map(([key, label]) => {
    const shortLabel = splitLabels[key];
    const sortAction = sharedFirst ? '' : ' onclick="order(\'' + key + '\')"';
    const arrow = sharedFirst ? '' : ' ↕';
    return '<th' + sortAction + '>' + (shortLabel ?? label) + arrow + '</th>';
  }).join('');

  const body = rows.map(row => {
    const position = sharedFirst ? '1º' : row.posicao ? row.posicao + 'º' : '—';
    const results = wods.map(wod => {
      const score = row.resultados[wod.id];
      if (!score) return '<td class="score">—</td>';
      const result = formatScore(score, wod.id);
      if (sharedFirst) return '<td class="score">' + result + '</td>';
      return '<td class="score"><b>' + score.pontos + '</b><small>' + result + '</small></td>';
    }).join('');
    const total = sharedFirst ? '' : '<td class="pts">' + (row.pontos || '—') + '</td>';
    return '<tr><td class="pos">' + position + '</td><td><span class="team" onclick="showTeam(' +
      data.indexOf(row) + ')">' + row.equipe + '</span></td>' + results + total + '</tr>';
  }).join('');
  board.innerHTML = '<thead><tr>' + headers + '</tr></thead><tbody>' + body + '</tbody>';
}
function order(k){sort={key:k,asc:sort.key===k?!sort.asc:true};render()}function loadData(){statusEl.textContent='ATUALIZANDO…';fetch(URL).then(r=>r.json()).then(p=>{data=p.ranking;wods=p.wods;const categorias=(p.categorias||[]).filter(Boolean);cat.innerHTML=categorias.map(x=>'<option>'+x+'</option>').join('');cat.onchange=render;statusEl.textContent='ATUALIZADO '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});render()}).catch(()=>statusEl.textContent='INDISPONÍVEL')}loadData();</script></body></html>
